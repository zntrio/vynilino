version: 2

project_name: vynilino

before:
  hooks:
    - go mod download
    - touch web/ui/.gitkeep

builds:
  - id: vynilino
    main: ./cmd/vynilino
    binary: vynilino
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # darwin/amd64 is less relevant for a server binary; keep if desired
      - goos: darwin
        goarch: amd64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: vynilino
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
