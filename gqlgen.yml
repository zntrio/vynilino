schema:
  - internal/adapter/graphql/graph/schema.graphql

exec:
  filename: internal/adapter/graphql/graph/generated.go
  package: graph

model:
  filename: internal/adapter/graphql/graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: internal/adapter/graphql/graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Time:
    model: github.com/99designs/gqlgen/graphql.Time

autobind:
  - zntr.io/vynilino/internal/domain

omit_slice_element_pointers: false
