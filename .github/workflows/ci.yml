# All action references below use version tags as placeholders.
# Per SLSA compliance (task 2.1), pin every @vX tag to a full commit SHA before merging:
#   gh api repos/<OWNER>/<REPO>/git/ref/tags/<TAG> --jq .object.sha
# Or use: https://github.com/mheap/pin-github-action

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@cdcb36043059300366feb6d5a6b85039743c59d6 # v5.0.1
        with:
          go-version-file: go.mod
          cache: false # golangci-lint manages its own cache
      - name: golangci-lint
        uses: golangci/golangci-lint-action@3cfe3a4abbb849e10058ce4af15d205b6da42804 # v4.0.0
        with:
          version: latest

  nilaway:
    name: Nilaway (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@cdcb36043059300366feb6d5a6b85039743c59d6 # v5.0.1
        with:
          go-version-file: go.mod
          cache: true
      - name: Install nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@latest
      - name: Run nilaway
        run: nilaway ./...
